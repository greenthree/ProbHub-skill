name: Mutation benchmark

"on":
  pull_request:
    paths:
      - ".github/workflows/mutation-benchmark.yml"
      - "probhub/mutation.py"
      - "probhub/judging.py"
      - "probhub/process_control.py"
      - "tests/benchmarks/benchmark_mutation.py"
      - "tests/fixtures/workspaces/mutation/**"
      - "tests/test_mutation.py"
      - "tests/test_mutation_benchmark.py"
  workflow_dispatch:
    inputs:
      repetitions:
        description: Sequential repetitions of each jobs 1/2/4 profile matrix
        required: false
        default: "1"
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

concurrency:
  group: mutation-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Python runtime
        run: python -m pip install -r requirements.txt
      - name: Assert g++ toolchain is available
        run: g++ --version
      - name: Run sequential shadow scheduler profile matrices
        shell: pwsh
        env:
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '1' }}
        run: |
          New-Item -ItemType Directory -Force benchmark-results | Out-Null
          $profiles = @(
            @{ Name = "balanced"; MaxMutants = 4 },
            @{ Name = "many-light"; MaxMutants = 8 },
            @{ Name = "few-heavy"; MaxMutants = 3 }
          )
          foreach ($profile in $profiles) {
            python tests/benchmarks/benchmark_mutation.py `
              --matrix `
              --profile $profile.Name `
              --repetitions $env:BENCHMARK_REPETITIONS `
              --timeout 600 `
              --mutant-timeout 180 `
              --max-mutants $profile.MaxMutants `
              --output "benchmark-results/mutation-$($profile.Name)-$($env:RUNNER_OS.ToLowerInvariant()).json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Upload JSON observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-benchmark-${{ runner.os }}
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 30
