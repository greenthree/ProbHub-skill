name: Mutation benchmark

"on":
  pull_request:
    paths:
      - ".github/workflows/mutation-benchmark.yml"
      - "probhub/**"
      - "scripts/local_judge.py"
      - "references/testlib.h"
      - "requirements.txt"
      - "tests/benchmarks/benchmark_mutation.py"
      - "tests/fixture_support.py"
      - "tests/fixtures/workspaces/mutation/**"
      - "tests/fixtures/workspaces/mutation-many-light/**"
      - "tests/fixtures/workspaces/mutation-few-heavy/**"
      - "tests/fixtures/workspaces/mutation-mixed-runtime/**"
      - "tests/test_mutation.py"
      - "tests/test_mutation_benchmark.py"
      - "tests/test_mutation_mixed_fixture.py"
  workflow_dispatch:
    inputs:
      repetitions:
        description: Repetitions for cache-pair and contention observations (1-20)
        required: false
        default: "1"
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

concurrency:
  group: mutation-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-matrix:
    env:
      OBSERVATION_REPETITIONS: ${{ github.event_name == 'schedule' && '5' || inputs.repetitions || '1' }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Python runtime
        run: python -m pip install -r requirements.txt
      - name: Assert g++ toolchain is available
        run: g++ --version
      - name: Run sequential shadow scheduler profile matrices
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force benchmark-results | Out-Null
          $profiles = @(
            @{ Name = "balanced"; MaxMutants = 4 },
            @{ Name = "many-light"; MaxMutants = 8 },
            @{ Name = "few-heavy"; MaxMutants = 3 },
            @{ Name = "mixed-runtime"; MaxMutants = 6 }
          )
          foreach ($profile in $profiles) {
            python tests/benchmarks/benchmark_mutation.py `
              --matrix `
              --profile $profile.Name `
              --repetitions 1 `
              --timeout 600 `
              --mutant-timeout 180 `
              --max-mutants $profile.MaxMutants `
              --cache-profile cold `
              --output "benchmark-results/mutation-$($profile.Name)-$($env:RUNNER_OS.ToLowerInvariant()).json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Observe logical sandbox cache cold and warm runs
        shell: pwsh
        run: |
          python tests/benchmarks/benchmark_mutation.py `
            --cache-pair `
            --profile balanced `
            --jobs 1 `
            --timeout 600 `
            --mutant-timeout 180 `
            --max-mutants 1 `
            --repetitions $env:OBSERVATION_REPETITIONS `
            --output "benchmark-results/mutation-cache-pair-$($env:RUNNER_OS.ToLowerInvariant()).json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Observe same-host two-problem contention
        shell: pwsh
        run: |
          python tests/benchmarks/benchmark_mutation.py `
            --contention `
            --contention-profile many-light `
            --contention-profile mixed-runtime `
            --jobs 1 `
            --cache-profile cold `
            --timeout 600 `
            --mutant-timeout 180 `
            --max-mutants 2 `
            --repetitions $env:OBSERVATION_REPETITIONS `
            --output "benchmark-results/mutation-contention-$($env:RUNNER_OS.ToLowerInvariant()).json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload JSON observation
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-benchmark-${{ runner.os }}
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 30
