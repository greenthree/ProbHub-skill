name: Mutation benchmark

"on":
  pull_request:
    paths:
      - ".github/workflows/mutation-benchmark.yml"
      - "probhub/mutation.py"
      - "probhub/judging.py"
      - "probhub/process_control.py"
      - "tests/benchmarks/benchmark_mutation.py"
      - "tests/fixtures/workspaces/mutation/**"
      - "tests/test_mutation.py"
      - "tests/test_mutation_benchmark.py"
  workflow_dispatch:
    inputs:
      repetitions:
        description: Sequential repetitions of the jobs 1/2/4 matrix
        required: false
        default: "5"
  schedule:
    - cron: "41 3 * * 3"

permissions:
  contents: read

concurrency:
  group: mutation-benchmark-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shadow-matrix:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pinned Python runtime
        run: python -m pip install -r requirements.txt
      - name: Assert g++ toolchain is available
        run: g++ --version
      - name: Run sequential shadow scheduler matrix
        shell: pwsh
        env:
          BENCHMARK_REPETITIONS: ${{ inputs.repetitions || '5' }}
        run: |
          New-Item -ItemType Directory -Force benchmark-results | Out-Null
          python tests/benchmarks/benchmark_mutation.py `
            --matrix `
            --repetitions $env:BENCHMARK_REPETITIONS `
            --timeout 300 `
            --mutant-timeout 120 `
            --max-mutants 4 `
            --output "benchmark-results/mutation-$($env:RUNNER_OS.ToLowerInvariant()).json"
      - name: Upload JSON observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mutation-benchmark-${{ runner.os }}
          path: benchmark-results/*.json
          if-no-files-found: warn
          retention-days: 30
