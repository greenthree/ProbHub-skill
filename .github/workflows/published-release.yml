name: Published release verification

"on":
  workflow_dispatch:
    inputs:
      version:
        description: Exact published semver without the v prefix
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: published-release-${{ inputs.version }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  NPM_REGISTRY: https://registry.npmjs.org/
  TYPST_VERSION: v0.14.2
  TYPST_LINUX_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
  TYPST_WINDOWS_SHA256: 51353994ac83218c3497052e89b2c432c53b9d4439cdc1b361e2ea4798ebfc13
  TYPST_IGNORE_SYSTEM_FONTS: "true"
  PROBHUB_RUN_TYPST_E2E: "1"

jobs:
  release-metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate exact version input
        shell: pwsh
        run: |
          if ($env:RELEASE_VERSION -notmatch '^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)(?:-[0-9A-Za-z.-]+)?$') {
            throw "version must be an exact semver without a v prefix"
          }
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: python -m pip install -r requirements.txt
      - name: Verify GitHub and npm publication identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python scripts/check_published_release.py
          --version "${{ inputs.version }}"
          --repo "${{ github.repository }}"
          --registry "https://registry.npmjs.org/"
          --output "release-results/published-release.json"
          --json
      - name: Upload publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: published-release-${{ inputs.version }}
          path: release-results/published-release.json
          if-no-files-found: error
          retention-days: 90

  registry-clean-install:
    needs: release-metadata
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/v${{ inputs.version }}
          fetch-depth: 1
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - name: Assert g++ toolchain is available
        run: g++ --version
      - name: Install pinned Typst (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/typst.tar.xz" \
            "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_LINUX_SHA256  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install pinned Typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'typst.zip'
          $url = "https://github.com/typst/typst/releases/download/$env:TYPST_VERSION/typst-x86_64-pc-windows-msvc.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:TYPST_WINDOWS_SHA256) {
            throw "Typst archive checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\typst-x86_64-pc-windows-msvc"
      - name: Run exact registry clean-install delivery flow
        run: >-
          python scripts/check_clean_install.py
          --registry-version "${{ inputs.version }}"
          --registry "https://registry.npmjs.org/"
          --output "release-results/clean-install-${{ runner.os }}.json"
          --json
      - name: Upload clean-install evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: registry-clean-install-${{ inputs.version }}-${{ runner.os }}
          path: release-results/clean-install-*.json
          if-no-files-found: error
          retention-days: 90
