name: CI

on:
  push:
  pull_request:

env:
  TYPST_VERSION: v0.14.2

jobs:
  quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Assert g++ toolchain is available
        run: g++ --version
      - name: Install pinned Typst (Linux)
        if: runner.os == 'Linux'
        run: |
          curl -sSL -o "$RUNNER_TEMP/typst.tar.xz" "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install pinned Typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/typst/typst/releases/download/$env:TYPST_VERSION/typst-x86_64-pc-windows-msvc.zip" -OutFile "$env:RUNNER_TEMP\typst.zip"
          Expand-Archive -Path "$env:RUNNER_TEMP\typst.zip" -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\typst-x86_64-pc-windows-msvc"
      - name: Typst smoke compile
        shell: bash
        run: |
          typst --version
          printf 'Typst toolchain smoke test.\n' > "$RUNNER_TEMP/smoke.typ"
          typst compile "$RUNNER_TEMP/smoke.typ" "$RUNNER_TEMP/smoke.pdf"
          test -s "$RUNNER_TEMP/smoke.pdf"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run check
      - name: Verify both npm package contents
        run: npm run pack:check
