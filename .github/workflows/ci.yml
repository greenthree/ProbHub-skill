name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  schedule:
    - cron: "17 2 * * 1"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TYPST_VERSION: v0.14.2
  TYPST_LINUX_SHA256: a6044cbad2a954deb921167e257e120ac0a16b20339ec01121194ff9d394996d
  TYPST_WINDOWS_SHA256: 51353994ac83218c3497052e89b2c432c53b9d4439cdc1b361e2ea4798ebfc13
  CJK_FONT_SHA256: 2c76254f6fc379fddfce0a7e84fb5385bb135d3e399294f6eeb6680d0365b74b
  TYPST_IGNORE_SYSTEM_FONTS: "true"
  PROBHUB_RUN_TYPST_E2E: "1"

jobs:
  quality:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Assert g++ toolchain is available
        run: g++ --version
      - name: Install pinned Typst (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/typst.tar.xz" \
            "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_LINUX_SHA256  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install pinned Typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'typst.zip'
          $url = "https://github.com/typst/typst/releases/download/$env:TYPST_VERSION/typst-x86_64-pc-windows-msvc.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:TYPST_WINDOWS_SHA256) {
            throw "Typst archive checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\typst-x86_64-pc-windows-msvc"
      - name: Verify bundled CJK font and Typst smoke compile
        shell: pwsh
        run: |
          $expected = "typst $($env:TYPST_VERSION.Substring(1))"
          $actual = (& typst --version).Trim()
          if (-not $actual.StartsWith($expected)) {
            throw "Unexpected Typst version: $actual"
          }
          $fontDir = (Resolve-Path 'probhub/assets/fonts').Path
          $font = Join-Path $fontDir 'NotoSansCJKsc-Regular.otf'
          $fontHash = (Get-FileHash -Algorithm SHA256 $font).Hash.ToLowerInvariant()
          if ($fontHash -ne $env:CJK_FONT_SHA256) {
            throw "Bundled CJK font checksum mismatch: $fontHash"
          }
          if (@(& typst fonts --font-path $fontDir --ignore-system-fonts) -notcontains 'Noto Sans CJK SC') {
            throw 'Bundled Noto Sans CJK SC font was not discovered'
          }
          $source = Join-Path $env:RUNNER_TEMP 'smoke.typ'
          $output = Join-Path $env:RUNNER_TEMP 'smoke.pdf'
          Set-Content -LiteralPath $source -Encoding utf8NoBOM -Value "#set text(font: `"Noto Sans CJK SC`")`nProbHub 固定字体。"
          & typst compile --font-path $fontDir --ignore-system-fonts $source $output
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $output) -or (Get-Item $output).Length -eq 0) {
            throw 'Typst smoke compilation failed'
          }
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt
      - run: npm ci
      - run: npm run check
      - name: Verify both npm package contents
        run: npm run pack:check

  clean-install-e2e:
    if: github.event_name != 'schedule'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.10"
          - os: windows-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - name: Assert g++ toolchain is available
        run: g++ --version
      - name: Install pinned Typst (Linux)
        if: runner.os == 'Linux'
        run: |
          curl --fail --location --silent --show-error --retry 3 --retry-all-errors \
            -o "$RUNNER_TEMP/typst.tar.xz" \
            "https://github.com/typst/typst/releases/download/$TYPST_VERSION/typst-x86_64-unknown-linux-musl.tar.xz"
          echo "$TYPST_LINUX_SHA256  $RUNNER_TEMP/typst.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-x86_64-unknown-linux-musl" >> "$GITHUB_PATH"
      - name: Install pinned Typst (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $archive = Join-Path $env:RUNNER_TEMP 'typst.zip'
          $url = "https://github.com/typst/typst/releases/download/$env:TYPST_VERSION/typst-x86_64-pc-windows-msvc.zip"
          for ($attempt = 1; $attempt -le 3; $attempt++) {
            try {
              Invoke-WebRequest -Uri $url -OutFile $archive
              break
            } catch {
              if ($attempt -eq 3) { throw }
              Start-Sleep -Seconds (2 * $attempt)
            }
          }
          $actual = (Get-FileHash -Algorithm SHA256 $archive).Hash.ToLowerInvariant()
          if ($actual -ne $env:TYPST_WINDOWS_SHA256) {
            throw "Typst archive checksum mismatch: $actual"
          }
          Expand-Archive -Path $archive -DestinationPath "$env:RUNNER_TEMP"
          Add-Content -Path $env:GITHUB_PATH -Value "$env:RUNNER_TEMP\typst-x86_64-pc-windows-msvc"
      - name: Run clean npm and Python delivery flow
        run: python scripts/check_clean_install.py --json

  python-dependency-audit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.11"]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-audit.txt
      - name: Audit exact Python runtime dependency closure
        run: python scripts/audit_python_dependencies.py
